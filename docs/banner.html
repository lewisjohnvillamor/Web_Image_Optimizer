<!-- Source for docs/images/banner.png - the README banner.

     Designed at 900x300 because that is the width a README column
     actually renders at. An earlier version was laid out at 1280 and
     scaled down in the browser, which left the small type at ~9px and
     unreadable. Every size in here is the size a reader sees.

     To regenerate: render this file at 900x300 with device scale 2,
     quantise to 256 colours with dithering, then run it through this
     project:
       python -m image_optimizer <dir> <out> --format png --mode lossless --effort 6
     Truecolour PNG is 171 KiB; the palette version is 70 KiB at
     SSIM 0.9999 (the only gradient is the recessive glow). -->
<!doctype html><html><head><meta charset="utf-8"><style>
/* Designed at 900px - the width a README actually renders at - and shot at
   2x. Every size below is therefore the size a reader sees, not a size that
   gets scaled down into mush. */
:root{
  --surface-1:#17171a;
  --surface-2:#212126;
  --text-primary:#ffffff;
  --text-secondary:#d2d1c8;   /* lifted: this is read at 19px, not 30px */
  --text-muted:#9d9d94;
  --series-1:#4a90ec;         /* the "after" - the point */
  --context:#5b5b54;          /* the "before" - recessive, but visible */
  --hairline:#33333a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:900px;height:300px;background:var(--surface-1);
  font-family:'Roboto','DejaVu Sans',sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.glow{position:absolute;right:-90px;top:-130px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,144,236,.26) 0%,rgba(74,144,236,.08) 44%,transparent 70%)}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:1fr 330px;
  grid-template-rows:1fr;gap:34px;padding:34px 36px}

/* ---------- left: identity ---------- */
.left{display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
h1{font-size:39px;font-weight:700;letter-spacing:-1px;color:var(--text-primary);line-height:1.05}
.tagline{font-size:19px;line-height:1.5;color:var(--text-secondary);font-weight:400}
.tagline b{color:var(--text-primary);font-weight:500}

/* ---------- right: the one number ---------- */
.panel{background:var(--surface-2);border:1px solid var(--hairline);border-radius:14px;
  padding:16px 22px;display:flex;flex-direction:column;justify-content:center}
.hero{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
.hero .num{font-size:56px;font-weight:700;letter-spacing:-2px;color:var(--text-primary);line-height:.9}
.hero .unit{font-size:18px;font-weight:500;color:var(--text-secondary)}
.row{margin-bottom:12px}
.row:last-of-type{margin-bottom:0}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rowhead .k{font-size:13px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.08em}
.rowhead .v{font-size:16px;font-weight:600;color:var(--text-primary);
  font-variant-numeric:tabular-nums}
/* 18px mark, square at the baseline, 4px rounded data-end */
.bar{height:18px;border-radius:0 4px 4px 0;display:block}
.bar.context{background:var(--context)}
.bar.after{background:var(--series-1)}
.caption{margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline);
  font-size:13px;color:var(--text-muted);line-height:1.4}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 56 56" fill="none">
        <rect x="2" y="4.5" width="52" height="42" rx="9" stroke="#4a90ec" stroke-width="3.4"/>
        <circle cx="17.5" cy="18.5" r="4.4" fill="#ffffff"/>
        <path d="M7.5 39 L20 26.5 L28.5 35 L36 28.5 L48.5 41" stroke="#ffffff"
              stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="43" cy="42" r="11.8" fill="#17171a"/>
        <circle cx="43" cy="42" r="8.8" fill="#4a90ec"/>
        <path d="M43 37.6 L43 46.2 M39.2 42.6 L43 46.4 L46.8 42.6" stroke="#ffffff"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Web&nbsp;Image&nbsp;Optimizer</h1>
    </div>
    <p class="tagline">Measures every image, then ships the<br>
      <b>smallest file that still looks right</b>.</p>
  </div>

  <div class="panel">
    <div class="hero"><span class="num">92%</span><span class="unit">smaller</span></div>
    <div class="row">
      <div class="rowhead"><span class="k">Before</span><span class="v">2.0 MiB</span></div>
      <span class="bar context" style="width:100%"></span>
    </div>
    <div class="row">
      <div class="rowhead"><span class="k">After</span><span class="v">160.8 KiB</span></div>
      <span class="bar after" style="width:7.9%"></span>
    </div>
    <p class="caption">Five-image demo set, drawn to scale.</p>
  </div>
</div></body></html>
