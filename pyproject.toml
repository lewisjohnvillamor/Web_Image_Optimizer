[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-image-optimizer"
version = "2.0.0"
description = "Content-aware image optimisation for the web: per-image perceptual quality, modern formats, responsive variants and AI alt text."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
authors = [{ name = "Lewis John Villamor" }]
keywords = ["webp", "avif", "image", "optimization", "web-performance", "alt-text", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=10.0.0", "numpy>=1.22.0"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.0"]
avif = ["pillow-avif-plugin>=1.4.0"]
ai = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0"]
all = ["customtkinter>=5.2.0", "pillow-avif-plugin>=1.4.0", "anthropic>=0.40.0"]

[project.scripts]
image-optimizer = "image_optimizer.cli:main"

[tool.setuptools]
packages = ["image_optimizer"]
py-modules = ["image_optimizer_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
